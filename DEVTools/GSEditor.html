<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>GS Editor</title>
		<link rel="shortcut icon" type="image/png" sizes="16x16" href="/Assets/images/icon/icon-16x16.png" />
		<link rel="shortcut icon" type="image/png" sizes="32x32" href="/Assets/images/icon/icon-32x32.png" />
		<link rel="shortcut icon" type="image/png" sizes="48x48" href="/Assets/images/icon/icon-48x48.png" />
		<link rel="shortcut icon" type="image/png" sizes="64x64" href="/Assets/images/icon/icon-64x64.png" />
		<link rel="shortcut icon" type="image/png" sizes="128x128" href="/Assets/images/icon/icon-128x128.png" />
		<link rel="stylesheet" href="/Assets/css/style.min.css" />
		<link rel="stylesheet" href="/Assets/css/GoldSaucer.min.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body class="gs_page editor">
		<div class="app-layout">
			<aside class="sidebar-left">
				<div class="panel-header">Библиотека блоков</div>
				<div class="components-list" id="sidebar-btns"></div>
			</aside>

			<main class="main-workspace">
				<div class="top-toolbar">
					<span class="toolbar-title">GS Editor</span>
					<button class="btn-export" onclick="showExport()">ЭКСПОРТ HTML</button>
				</div>
				<div class="canvas-area">
					<div id="editor-canvas" class="gs_wrapper"></div>
				</div>
			</main>
		</div>

		<div class="code-modal" id="code-modal">
			<div class="code-modal-content">
				<div class="modal-header">
					<strong class="modal-title">HTML</strong>
					<button class="modal-close" onclick="closeExport()">✕</button>
				</div>
				<textarea id="export-code" readonly spellcheck="false"></textarea>
			</div>
		</div>

		<script>
			const canvas = document.getElementById("editor-canvas");
			let activeBlock = null;

			const templates = {
				h2: `<h2 class="gs_title"><img src="/Assets/images/GoldSaucer/star.png"></h2>`,
				h3: `<h3 class="gs_circle"></h3>`,
				h4: `<h4 class="gs_sm_head"></h4>`,
				p: `<p class="gs_text_default"></p>`,
				p_red: `<p class="gs_text_red"></p>`,
				img: `<div class="gs_wrapper_images"><img src="https://lds-img.finalfantasyxiv.com/h/9/FgM897Tv5TnhUN7HpKGHjYbXpg.jpg"/></div>`,
				group: `<div class="gs_group"></div>`,
				ground_mahjong: `<div class="gs_ground_mahjong"></div>`,
				anno: `<div class="gs_annotation gs_space-32"><h5 class="gs_annotation_title">Совет</h5><p class="gs_annotation_text">Информация...</p></div>`,
				table: `<table class="gs_guide_table"><thead><tr><th>Заголовок 1</th><th>Заголовок 2</th></tr></thead><tbody><tr><td>Ячейка 1</td><td>Ячейка 2</td></tr></tbody></table>`,
				guide_list: `<ul class="gs_guide_list"><li>Пункт списка</li></ul>`,
				rule_list: `<ul class="gs_rule"><li><h3 class="gs_rule_title">Название</h3><img src="https://lds-img.finalfantasyxiv.com/h/9/FgM897Tv5TnhUN7HpKGHjYbXpg.jpg"/><p>Описание правила</p></li></ul>`,
				icon_table: `<table class="gs_table"><thead><tr><th colspan="2">Item</th><th>Effect</th></tr></thead><tbody><tr><td class="gs_table_item"><div class="gs_ico_table_box"><img src="https://lds-img.finalfantasyxiv.com/h/9/FgM897Tv5TnhUN7HpKGHjYbXpg.jpg" class="gs_ico_table"/><i class="gs_ico_table_frame"></i></div></td><td>Название</td><td>Описание</td></tr></tbody></table>`,
				quest: `<h3 class="gs_quest"><a href="#" class="eorzeadb_link">Название квеста</a></h3><div class="gs_quest_info"><img src="https://lds-img.finalfantasyxiv.com/h/9/FgM897Tv5TnhUN7HpKGHjYbXpg.jpg"/><ul class="gs_quest__info"><li class="level">Level</li><li class="place">Место</li><li class="npc">NPC</li><li class="terms">Условия</li></ul></div>`,
			};

			const menuGroups = [
				{
					label: "Заголовки",
					items: [
						{id: "h2", n: "⭐ Заголовок H2"},
						{id: "h3", n: "🔵 Заголовок H3"},
						{id: "h4", n: "◽ Заголовок H4"},
					],
				},
				{
					label: "Текст",
					items: [
						{id: "p", n: "📄 Текст (p)"},
						{id: "p_red", n: "🔴 Красный текст"},
					],
				},
				{
					label: "Медиа",
					items: [{id: "img", n: "🖼️ Картинка"}],
				},
				{
					label: "Таблицы и списки",
					items: [
						{id: "table", n: "📊 Таблица"},
						{id: "icon_table", n: "🎒 Таблица с иконками"},
						{id: "guide_list", n: "• Список"},
						{id: "rule_list", n: "🃏 Список правил"},
						{id: "quest", n: "📜 Блок квеста"},
					],
				},
				{
					label: "Контейнеры",
					items: [
						{id: "group", n: "📦 Группа"},
						{id: "ground_mahjong", n: "🀄 Группа Mahjong"},
						{id: "anno", n: "💡 Аннотация"},
					],
				},
			];
			const menuItems = menuGroups.flatMap((g) => g.items);

			const sidebar = document.getElementById("sidebar-btns");
			menuGroups.forEach((group) => {
				const h = document.createElement("div");
				h.className = "sidebar-group-title";
				h.textContent = group.label;
				sidebar.appendChild(h);
				group.items.forEach((i) => {
					const b = document.createElement("button");
					b.className = "comp-btn";
					b.innerText = i.n;
					b.onclick = () => addBlock(i.id);
					sidebar.appendChild(b);
				});
			});

			function addBlock(type, target = canvas) {
				const wrapper = document.createElement("div");
				wrapper.className = "block-wrapper";
				wrapper.dataset.type = type;

				let toolbarHTML = `
            <div class="floating-toolbar">
                <button class="ft-btn" onclick="move(event, this, -1)">↑</button>
                <button class="ft-btn" onclick="move(event, this, 1)">↓</button>
                
                <label class="ft-btn ft-check" onclick="event.stopPropagation()">
                    <input type="checkbox" onchange="toggleMahjong(this)" /> mahjong
                </label>

                <button class="ft-btn primary" onmousedown="event.preventDefault(); formatRed()">🔴 Red</button>
                <button class="ft-btn primary" onmousedown="event.preventDefault(); formatLink()">🔗 Ссылка</button>
                <button class="ft-btn" onmousedown="event.preventDefault(); insertBrAtCursor()">↵ Перенос</button>
                ${type === "group" || type === "ground_mahjong" ? `<div style="position:relative;display:inline-block"><button class="ft-btn primary" onclick="toggleNest(event, this)">➕ Добавить</button><div class="nested-menu">${menuItems.map((m) => `<button onclick="addNested(event,'${m.id}')">${m.n}</button>`).join("")}</div></div>` : ""}
                ${type === "table" || type === "icon_table" ? `<button class="ft-btn primary" onclick="addTr(event)">+ Строка</button>` : ""}
                ${type === "guide_list" || type === "rule_list" ? `<button class="ft-btn primary" onclick="addLi(event)">+ Пункт</button>` : ""}
                <button class="ft-btn del" onclick="del(event, this)">✕</button>
            </div>`;

				wrapper.innerHTML = toolbarHTML + `<div class="block-content">${templates[type]}</div>`;

				if (type === "img") {
					const eb = document.createElement("div");
					eb.className = "img-edit-box";
					eb.innerHTML = `<input type="text" placeholder="URL картинки..." oninput="updImg(this)">`;
					wrapper.appendChild(eb);
				}

				wrapper.onclick = (e) => {
					e.stopPropagation();
					setActive(wrapper);
				};
				makeEdit(wrapper);
				target.appendChild(wrapper);
				setActive(wrapper);
			}

			function toggleMahjong(checkbox) {
				const targetElement = checkbox.closest(".block-wrapper").querySelector(".block-content").firstElementChild;

				if (checkbox.checked) {
					targetElement.classList.add("mahjong");
					if (targetElement.tagName === "H2" && targetElement.classList.contains("gs_title")) {
						const img = targetElement.querySelector("img");
						if (img) img.remove();
					}
				} else {
					targetElement.classList.remove("mahjong");
					if (targetElement.tagName === "H2" && targetElement.classList.contains("gs_title")) {
						if (!targetElement.querySelector("img")) {
							const img = document.createElement("img");
							img.src = "/Assets/images/GoldSaucer/star.png";
							targetElement.prepend(img);
						}
					}
				}
			}

			function setActive(el) {
				if (activeBlock) activeBlock.classList.remove("active");
				activeBlock = el;
				activeBlock.classList.add("active");
				document.querySelectorAll(".nested-menu").forEach((m) => (m.style.display = "none"));
			}

			function makeEdit(cont) {
				cont.querySelectorAll("h2, h3, h4, h5, p, td, th, li, a").forEach((el) => {
					el.contentEditable = true;
					el.onkeydown = (e) => {
						if (e.key === "Enter") {
							e.preventDefault();
							insertBrAtCursor();
						}
					};

					el.onpaste = (e) => {
						e.preventDefault();
						let text = e.clipboardData.getData("text/plain");
						text = text.replace(/\r?\n/g, " ").replace(/\s\s+/g, " ");
						text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
						document.execCommand("insertHTML", false, text);
					};
				});

				cont.querySelectorAll("img").forEach((img) => {
					img.onclick = () => {
						const url = prompt("URL картинки:", img.getAttribute("src") || "");
						if (url) img.src = url;
					};
				});
			}

			function insertBrAtCursor() {
				const s = window.getSelection();
				if (!s.rangeCount) return;
				const r = s.getRangeAt(0);
				const br = document.createElement("br");
				r.deleteContents();
				r.insertNode(br);
				r.setStartAfter(br);
				r.collapse(true);
				s.removeAllRanges();
				s.addRange(r);
			}

			function formatRed() {
				const s = window.getSelection();
				if (s.isCollapsed) return;
				const r = s.getRangeAt(0);
				const span = document.createElement("span");
				span.className = "gs_text_red";
				span.appendChild(r.extractContents());
				r.insertNode(span);
				s.removeAllRanges();
			}

			function formatLink() {
				const s = window.getSelection();
				if (s.isCollapsed) return;
				const url = prompt("URL ссылки:", "https://");
				if (!url) return;
				const r = s.getRangeAt(0);
				const a = document.createElement("a");
				a.className = "gs_link";
				a.href = url;
				a.appendChild(r.extractContents());
				r.insertNode(a);
				s.removeAllRanges();
			}

			function addTr(e) {
				e.stopPropagation();
				const table = activeBlock.querySelector("table");
				const tbody = table.querySelector("tbody") || table;
				const rows = tbody.querySelectorAll(":scope > tr");
				const row = rows[rows.length - 1].cloneNode(true);
				row.querySelectorAll("td, th").forEach((cell) => {
					if (!cell.querySelector("img")) cell.textContent = "...";
				});
				tbody.appendChild(row);
				makeEdit(row);
			}

			function addLi(e) {
				e.stopPropagation();
				const list = activeBlock.querySelector("ul");
				const items = list.querySelectorAll(":scope > li");
				const li = items[items.length - 1].cloneNode(true);
				const textEls = li.querySelectorAll("h2, h3, h4, h5, p");
				if (textEls.length) {
					textEls.forEach((el) => (el.textContent = ""));
				} else {
					li.textContent = "";
				}
				list.appendChild(li);
				makeEdit(li);
			}

			function toggleNest(e, b) {
				e.stopPropagation();
				const m = b.nextElementSibling;
				m.style.display = m.style.display === "flex" ? "none" : "flex";
			}

			function addNested(e, t) {
				e.stopPropagation();
				const container = activeBlock.querySelector(".gs_group, .gs_ground_mahjong");
				if (container) addBlock(t, container);
			}

			function move(e, b, d) {
				e.stopPropagation();
				const w = b.closest(".block-wrapper");
				if (d === -1 && w.previousElementSibling) w.parentNode.insertBefore(w, w.previousElementSibling);
				if (d === 1 && w.nextElementSibling) w.parentNode.insertBefore(w.nextElementSibling, w);
			}

			function del(e, b) {
				e.stopPropagation();
				b.closest(".block-wrapper").remove();
				activeBlock = null;
			}

			function updImg(i) {
				const img = i.closest(".block-wrapper").querySelector("img");
				if (img) img.src = i.value;
			}

			function getCleanHTML(container) {
				let html = "";
				const children = container.children;

				for (let i = 0; i < children.length; i++) {
					const w = children[i];
					if (!w.classList.contains("block-wrapper")) continue;

					const type = w.dataset.type;
					const contentBox = w.querySelector(":scope > .block-content");

					if (!contentBox) continue;

					if (type === "group" || type === "ground_mahjong") {
						const groupContainer = contentBox.querySelector(".gs_group, .gs_ground_mahjong");

						if (groupContainer) {
							const innerHTML = getCleanHTML(groupContainer);
							const baseClass = type === "group" ? "gs_group" : "gs_ground_mahjong";
							const extraClasses = Array.from(groupContainer.classList)
								.filter((c) => c !== "gs_group" && c !== "gs_ground_mahjong")
								.join(" ");

							html += `<div class="${baseClass} ${extraClasses}">\n${innerHTML}</div>\n`;
						}
					} else {
						const temp = document.createElement("div");
						temp.innerHTML = contentBox.innerHTML;
						temp.querySelectorAll("[contenteditable]").forEach((el) => el.removeAttribute("contenteditable"));
						html += temp.innerHTML + "\n";
					}
				}
				return html;
			}

			function showExport() {
				const finalHTML = getCleanHTML(canvas);
				document.getElementById("export-code").value = finalHTML.trim();
				document.getElementById("code-modal").style.display = "flex";
			}

			function closeExport() {
				document.getElementById("code-modal").style.display = "none";
			}

			document.onclick = (e) => {
				if (!e.target.closest(".block-wrapper") && !e.target.closest(".sidebar-left")) {
					if (activeBlock) activeBlock.classList.remove("active");
					activeBlock = null;
					document.querySelectorAll(".nested-menu").forEach((m) => (m.style.display = "none"));
				}
			};
		</script>
	</body>
</html>
